# Lock the Sennheiser BTD 700 USB Bluetooth dongle to OUTPUT-ONLY stereo.
#
# Why: the dongle is a USB Audio Class card whose firmware renegotiates the
# downstream Bluetooth link. When the host opens the USB *capture* endpoint,
# the firmware drops high-quality A2DP stereo and switches to HFP/headset
# (call) mode -> hollow, muffled "bad phone call" audio. By selecting a
# profile that exposes NO source node, the capture endpoint is never opened
# and the HFP switch can never be triggered.
#
# Format: WirePlumber 0.5 SPA-JSON drop-in (merged into wireplumber.conf).
# To revert: delete this file and run `systemctl --user restart wireplumber`.

monitor.alsa.rules = [
  {
    # --- Rule 1: pin the DEVICE to the output-only stereo profile ---
    matches = [
      {
        # Stable, serial-based card name -> survives reboots & re-plugs.
        device.name = "alsa_card.usb-Sennheiser_BTD_700_09B88CA9D1121BAB3C08-02"
      }
    ]
    actions = {
      update-props = {
        # Profile with sinks:1, sources:0 (no mic node -> no HFP trigger).
        device.profile = "output:analog-stereo"
        # Belt-and-suspenders: never auto-switch the profile away.
        api.acp.auto-profile = false
      }
    }
  }
  {
    # --- Rule 2: pin the dongle's SINK node to 48 kHz ---
    matches = [
      {
        node.name = "alsa_output.usb-Sennheiser_BTD_700_09B88CA9D1121BAB3C08-02.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        # Standard rate; matches the PipeWire graph default to avoid resampling.
        audio.rate = 48000
      }
    }
  }
]
