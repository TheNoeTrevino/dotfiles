    info_fg: '#00AFFF'
    info_bg: '#00005F'
    warning_fg: '#FFD700'
    warning_bg: '#875F00'
    error_fg: '#FF0000'
    error_bg: '#5F0000'
    status_bar_bg: '#874BFD'
    status_bar_text: '#D0D0D0'
