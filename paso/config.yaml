key_mappings:
    add_task: a
    edit_task: e
    delete_task: d
    move_task_left: J
    move_task_right: ':'
    move_task_up: L
    move_task_down: K
    view_task: o
    edit_labels: ctrl+l
    edit_parent_task: p
    edit_child_task: c
    save_form: ctrl+s
    create_column: C
    rename_column: R
    delete_column: X
    create_project: P
    edit_project: E
    delete_project: D
    prev_column: j
    next_column: ;
    prev_task: l
    next_task: k
    scroll_viewport_left: '['
    scroll_viewport_right: ']'
    next_project: '}'
    prev_project: '{'
    show_help: '?'
    connect_remote: ctrl+h
    quit: q
    toggle_view: v
    change_status: s
    sort_list: S
