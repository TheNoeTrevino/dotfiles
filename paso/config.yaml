key_mappings:
  # Task operations
  add_task: "a"
  edit_task: "e"
  delete_task: "d"
  move_task_left: "J"
  move_task_right: ":"
  move_task_up: "L"
  move_task_down: "K"
  view_task: "o"  # space key
  edit_labels: "l"

  # Column operations
  create_column: "C"
  rename_column: "R"
  delete_column: "X"

  # Project operations
  create_project: "P"

  # Navigation
  prev_column: "j"
  next_column: ";"
  prev_task: "l"
  next_task: "k"
  scroll_viewport_left: "["
  scroll_viewport_right: "]"
  next_project: "}"
  prev_project: "{"

  # Other
  show_help: "?"
  quit: "q"

