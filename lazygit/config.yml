gui:
  skipRewordInEditorWarning: true
keybinding:
  universal:
    prevScreenMode: "-"
  commits:
    renameCommit: R
    renameCommitWithEditor: r
  files:
    collapseAll: "_"
    commitChanges: C
    commitChangesWithEditor: c
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --line-numbers
quitOnTopLevelReturn: true
showCommandLog: false
