onboarding = false
# herdr configuration
# Migrated from ~/.config/tmux/tmux.conf.
# Print every available option with: herdr --default-config
# Validate this file with: herdr config check

# The tmux config used Kanagawa hex colors inline (#7E9CD8, #FFA065, #363646,
# #688E81). Herdr ships Kanagawa as a built-in theme, so one line replaces the
# whole block of tmux *-style options.
[theme]
name = "kanagawa"

auto_switch = false
[terminal]
# New panes and tabs inherit the cwd of the pane they came from.
new_cwd = "follow"

[keys]
# tmux used Ctrl-Space, not Ctrl-b.
prefix = "ctrl+space"

# --- carried over from tmux ---
reload_config = "prefix+r"        # tmux: bind r source-file
split_vertical = "prefix+|"       # tmux: bind | split-window -h
split_horizontal = "prefix+minus" # tmux: bind - split-window -v
close_pane = "prefix+x"           # tmux: bind x kill-pane
zoom = "prefix+z"                 # replaces the tmux-zoom.sh run-shell hack
copy_mode = "prefix+["            # tmux default copy-mode key
detach = "prefix+d"

# Herdr binds settings to prefix+s by default. tmux used prefix s for the
# session chooser, so the picker takes prefix+s and settings moves.
workspace_picker = "prefix+w"
settings = "prefix+S"
goto = "prefix+s"

toggle_sidebar = "prefix+p"

# resize_mode moves off prefix+r because reload_config took it.
resize_mode = "prefix+shift+r"

# --- pane focus: plain hjkl, not the old shifted jkl; scheme ---
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# --- tabs are tmux windows ---
new_tab = "prefix+c"
previous_tab = "alt+comma" # tmux: bind -n M-,
next_tab = "alt+period"    # tmux: bind -n M-.
# Ghostty reports Alt+Shift+,/. as the SHIFTED glyph (< / >) with the Shift
# modifier still set. The old tmux config hit this too and had to bind both
# M-< and M-S-<. A herdr binding may be an array, so cover all three spellings.
move_tab_previous = [
  "alt+shift+comma",
  "alt+<",
  "alt+shift+<",
] # tmux: M-< swap-window
move_tab_next = [
  "alt+shift+period",
  "alt+>",
  "alt+shift+>",
] # tmux: M-> swap-window

# Indexed jumps. Use these explicit fields, NOT [keys.indexed] -- the herdr docs
# call that table legacy, kept only for compatibility.
# After the prefix, a plain digit and a shifted digit both arrive as ordinary
# characters, so neither depends on the terminal's keyboard protocol.
switch_tab = "alt+shift+1..9"
switch_workspace = "alt+1..9"
next_workspace = "alt+down"
previous_workspace = "alt+up"
close_tab = "prefix+shift+x"

# --- Shift+arrow resize, no mode, same as tmux ---
resize_pane_left = "shift+left"
resize_pane_down = "shift+down"
resize_pane_up = "shift+up"
resize_pane_right = "shift+right"

# herdr's documented slot for indexed agents. Left commented because your server
# log flags alt chords ("flushing lone escape after input timeout"). Uncomment
# and test; if it does not fire, alt is the reason, not the 1..9 syntax.
focus_agent = "prefix+alt+1..9"
previous_agent = "alt+left"
next_agent = "alt+right"

# --- seamless nvim <-> pane navigation (willfish/herdr-navigator) ---
# Install: herdr plugin install willfish/herdr-navigator
# The plugin reads the active pane's foreground process. On nvim it runs
# `herdr pane send-keys` so nvim moves its own split; on anything else it runs
# `herdr pane focus`. The nvim half is willfish/herdr-navigator.nvim, wired up
# in ~/.config/nvim/lua/plugins/tools/herdr-navigator.lua.
#
# These use ctrl, NOT the plugin's documented alt. Alt chords misfire here (see
# the focus_agent note above). Upstream hardcodes the forwarded key in its
# herdr-plugin.toml, so that manifest is edited locally to send ctrl+hjkl:
#   ~/.config/herdr/plugins/github/willfish.herdr-navigator-*/herdr-plugin.toml
# Re-apply that edit after `herdr plugin install` overwrites it.
#
# NOTE: these are prefix-free. focus_pane_* on prefix+hjkl still works.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "willfish.herdr-navigator.left"
description = "navigate left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "willfish.herdr-navigator.down"
description = "navigate down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "willfish.herdr-navigator.up"
description = "navigate up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "willfish.herdr-navigator.right"
description = "navigate right"

# Name an agent. There is no rename_agent ACTION -- herdr's action bindings are a
# closed enum (rename_tab / rename_workspace / rename_pane), so the built-in modal
# overlay cannot be pointed at an agent from config. This is the closest stand-in.
#
# MUST be type = "popup". type = "shell" runs detached in the background with no
# TTY, so it can never draw a prompt, and bare `herdr agent rename` (which is
# `<TARGET> <NAME>`) would have failed on missing args where you'd never see it.
#
# NOTE: prefix+shift+p is still the real overlay for the same job -- rename_pane
# is unset here so it keeps its default, and an agent always occupies a pane.
# This binding exists because it ALSO sets agent.name, the unique slug that
# `herdr agent prompt <name> ...` targets, which rename_pane does not touch.
[[keys.command]]
key = "prefix+A"
type = "popup"
command = "/home/noetrevino/.config/herdr/agent-rename.sh"
width = "70%"
height = "50%"
description = "rename agent"

[ui]
# tmux: set -g mouse on
mouse_capture = true
copy_on_select = true

# host_cursor defaults to "auto", which draws herdr's own cell cursor on WSL and
# native Windows. A drawn cursor is always a block, so nvim's insert-mode bar
# (DECSCUSR) never showed. "native" hands the shape back to the outer terminal.
# Trade-off: occasional cursor artifacts during heavy output. Use "drawn" to revert.
host_cursor = "native"

# tmux: set -g status-position top
tab_bar_position = "bottom"

sidebar_collapsed_mode = "compact"

prompt_new_workspace_name = true

# Reworked tmux status-right: git branch, then the focused space name. The date
# and clock are gone -- waybar already draws both, so they were duplicated on
# every screen.
#
# Command entries run through `/bin/sh -lc` on the herdr server, in the active
# pane's working directory, and herdr shows the LAST line of successful output.
# Outside a repo `git rev-parse` fails, the `&&` short-circuits, and herdr
# clears the entry. That replaces the tmux `2>/dev/null` fallback.
#
# The space name HAS to be a command. tab_bar_right accepts only zoom, hostname,
# datetime, text, and command -- there is no `workspace` token here, unlike
# [ui.sidebar.spaces] below. And because status commands run on the SERVER
# rather than inside a pane, $HERDR_WORKSPACE_ID is not in their environment,
# so the socket API is the only way to learn which space is focused;
# `herdr workspace list` flags it with "focused": true. `// empty` blanks the
# entry instead of printing "null" for an unnamed space.
# NOTE: this needs jq on whichever machine runs the herdr server.
#
# The separator is U+2502 BOX DRAWINGS LIGHT VERTICAL, not ASCII `|`, so it
# draws the full cell height.
tab_bar_right = [
  { type = "command", command = 'b=$(git rev-parse --abbrev-ref HEAD 2>/dev/null) && printf "  %s" "$b"', interval_seconds = 5, timeout_seconds = 2 },
  { type = "text", text = "│" },
  { type = "command", command = 'herdr workspace list | jq -r ".result.workspaces[] | select(.focused) | .label // empty"', interval_seconds = 2, timeout_seconds = 2 },
]
tab_bar_right_separator = " "

# Agent state glyphs: "dots" colors one shape (● working, ● blocked, ○ idle),
# so shape carries nothing and the state is entirely in the color. "symbols"
# gives each state its own glyph, which reads without relying on color:
#   ×  blocked    ◐  working    ✓  done (finished while unwatched)
#   ○  idle (seen)              ·  unknown
# NOTE: ◐ is static, not an animated spinner -- state_icon_symbol() takes no
# frame/tick, so nothing in the sidebar animates. The spinner in upstream's demo
# is the agent's OWN spinner inside the pane, surfaced via the terminal_title
# token, not a herdr animation.
status_indicators = "symbols"

agent_panel_sort = "spaces"

# Rows mirror upstream's screenshot layout:
#   spaces -> name, with the state glyph trailing it
#   agents -> state glyph, location, then the state WORD on its own line
#
# The `agent` token is dropped from the agent rows. Every agent here is claude,
# so it printed the same word under every entry; `state_text` (idle / working /
# blocked / done) takes that line instead, which is what upstream shows.
#
# Neither panel is numbered. herdr 0.8.2 draws the 1..9 index ONLY in the
# collapsed rail (src/ui/sidebar.rs:823, inside render_sidebar_collapsed, which
# ui.rs:473 calls only when sidebar_collapsed); the expanded panel has no code
# path for it and there is no index token -- `number`, `index`, `position`,
# `num`, and `idx` are all rejected with "unknown sidebar token; custom tokens
# must start with `$`". Expanded numbering existed once (CHANGELOG 0.1.2) and
# was dropped silently; upstream's assets/screenshot.png still shows it, which
# is misleading. A `$num` metadata token fed by a polling service was the only
# workaround -- removed, because rows already render in switch_workspace order,
# so a row's position IS its index.
[ui.sidebar.spaces]
rows = [["workspace", "state_icon"], ["branch", "git_status"]]

# The `pane` token renders pane.label -- what prefix+shift+p (rename_pane) and
# agent-rename.sh set. There is deliberately no token for agent.name: herdr
# rejects `name` with "unknown sidebar token", so the slug handle is CLI-only.
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["state_text", "pane"]]

[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true
