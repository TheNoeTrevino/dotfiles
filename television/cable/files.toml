[metadata]
name = "files"
description = "A channel to select files and directories"
requirements = ["fd", "bat"]

[source]
# Mirrors your old FZF_DEFAULT_COMMAND: hidden files, strip the ./ prefix,
# skip .git. Cycle to the "All" source (ignores .gitignore too) with ctrl-s.
command = [
  { name = "Files", run = "fd -t f -H --strip-cwd-prefix --exclude .git" },
  { name = "All",   run = "fd -t f -H --no-ignore --strip-cwd-prefix --exclude .git" },
]

[preview]
command = "bat -n --color=always '{}'"
env = { BAT_THEME = "ansi" }

[keybindings]
shortcut = "f1"
f12 = "actions:edit"
ctrl-up = "actions:goto_parent_dir"

[actions.edit]
description = "Opens the selected entries with the default editor (falls back to vim)"
command = "${EDITOR:-vim} {}"
shell = "bash"
# use `mode = "fork"` if you want to return to tv afterwards
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv files .."
mode = "execute"
