# hypridle — idle daemon, triggers hyprlock and DPMS based on inactivity
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# NOTE ON THE dpms LINES. This machine runs the Lua config provider, where
# `hyprctl dispatch` parses its argument as a Lua expression -- the old
# `hyprctl dispatch dpms off` is a syntax error, so the screen would never blank
# and, worse, never come back on. hypridle runs each command through `sh -c`,
# hence the single quotes around the Lua.
#
# hl.dsp.dpms takes a TABLE: { action = "on"|"off" [, monitor = "<name>"] }.
# The positional form hl.dsp.dpms("on") does not error -- it turns every
# monitor OFF regardless of the string (verified 2026-09-08), so an "on" call
# written that way blanks the screens instead of waking them. This matches the
# form in the shipped /usr/share/hypr/hypridle.conf.

general {
    # Use loginctl so any locker that responds to the session-lock signal works.
    # hyprlock listens for this when launched as a service of the session.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 5 min idle → lock the screen
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min idle → turn the displays off (saves power, lock already up underneath)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 15 min idle → suspend the laptop, but ONLY when undocked. Resuming on the
# 40AS dock wedges its MST monitors until the dock is power-cycled; see
# idle-suspend.sh for the details. Same rule as lid-closed.sh.
listener {
    timeout = 900
    on-timeout = ~/.config/hypr/idle-suspend.sh
}
