# hypridle — idle daemon, triggers hyprlock and DPMS based on inactivity
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# NOTE ON THE dpms LINES. This machine runs the Lua config provider, where
# `hyprctl dispatch` parses its argument as a Lua expression -- the old
# `hyprctl dispatch dpms off` is a syntax error, so the screen would never blank
# and, worse, never come back on. hypridle runs each command through `sh -c`,
# hence the single quotes around the Lua.

general {
    # Use loginctl so any locker that responds to the session-lock signal works.
    # hyprlock listens for this when launched as a service of the session.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 5 min idle → lock the screen
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min idle → turn the displays off (saves power, lock already up underneath)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 15 min idle → suspend the laptop
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
