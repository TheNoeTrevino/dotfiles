# hyprlock — screen locker config
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Auth backend: /etc/pam.d/hyprlock (fingerprint via pam_fprintd, then password)

general {
    disable_loading_bar = true
    grace = 0                    # seconds before lock takes effect (0 = immediate)
    hide_cursor = true
    no_fade_in = false
    ignore_empty_input = true    # don't submit empty password on Enter
}

# Parallel auth: password (via PAM) AND fingerprint (via fprintd) at the same
# time. Whichever the user does first wins. Avoids the "PAM blocks on
# fingerprint while user types password" sequencing trap.
auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
        ready_message = Touch sensor or type password
        present_message = Scanning…
        retry_delay = 250        # ms between retries on a failed scan
    }
}

# Chainsaw Man wallpaper, lightly blurred so the foreground stays readable
background {
    monitor =
    path = /home/noetrevino/.config/wallpapers/chainsaw-man-the-5120x2880-23852.jpg
    blur_passes = 1
    blur_size = 4
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 90
    font_family = sans-serif
    color = rgba(ffffffff)
    position = 0, 80
    halign = center
    valign = center
}

# Date below clock
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    font_size = 22
    font_family = sans-serif
    color = rgba(ffffffcc)
    position = 0, 0
    halign = center
    valign = center
}

# Password field — also accepts fingerprint via PAM in parallel; no UI needed
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = true
    placeholder_text = <i>password or touch sensor</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 8
    position = 0, -80
    halign = center
    valign = center
}
