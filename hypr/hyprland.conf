#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 1.5
    gaps_out = 7

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(808080aa)
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 2
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = no, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.2, 1,    0.32, 1
    bezier = easeInOutCubic, 0.6, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,        1,     10,   almostLinear, slide
    animation = workspacesIn,      1,     1.21, almostLinear, slide
    animation = workspacesOut,     1,     1.94, almostLinear, slide
    animation = zoomFactor,        1,     7,    quick
    animation = specialWorkspace,  1,     4,    easeOutQuint, fade
    animation = specialWorkspaceIn,  1,     4,    linear, fade
    animation = specialWorkspaceOut, 1,     3,    linear, fade

}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    # vfr = true
}




#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    # Default = laptop-only state. monitors.sh's apply_docked clears this at
    # runtime when external monitors are connected.
    kb_options = caps:swapescape
    kb_rules =
    repeat_delay=300
    repeat_rate=100

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.2
        clickfinger_behavior = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets the Windows/Super key as main modifier

bind = , XF86AudioMedia, exec, wtype -k Page_Up
bind = , Print, exec, hyprshot -m region -o ~/Screenshots

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
# bind = $mainMod, M, exit,
bind = $mainMod, N, exec, $notification
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, Space, togglefloating,
# bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, F, fullscreen
# Screenshot has no chord: bare Print above already runs the same command, and
# $mainMod SHIFT + S is the special workspace.
bind = $mainMod SHIFT, R, exec, hyprcap rec region -c -n -o ~/ScreenRecordings
bind = $mainMod SHIFT, C, exec, hyprpicker --autocopy
# wlogout and hyprlock sit on Escape, not L: $mainMod + L and $mainMod SHIFT + L
# are focus-right and move-window-right.
bind = $mainMod, ESCAPE, exec, wlogout
bind = $mainMod SHIFT, ESCAPE, exec, hyprlock # Screen locker
# Deliberately ALT, not $mainMod: this chord kept its old modifier when the rest
# of the config moved to SUPER. ALT is otherwise unused now, so nothing clashes.
bind = ALT, SPACE, exec, $menu # Launcher / menu (see $menu at the top of this file)

# Toggle waybar: pkill exits 1 when nothing matched, so || starts it instead
bind = $mainMod, W, exec, pkill -x waybar || waybar

# Clipboard history picker (cliphist via fuzzel).
# --no-sort keeps cliphist's own most-recent-first ordering; fuzzel would
# otherwise re-sort the list and bury the entry you just copied.
bind = $mainMod, V, exec, cliphist list | fuzzel --dmenu --no-sort --prompt "Clipboard " | cliphist decode | wl-copy
# Night light toggle (hyprsunset)
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/sunset-toggle.sh

# Move focus with mainMod + hjkl
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod CONTROL, h, workspace, -1
bind = $mainMod CONTROL, l, workspace, +1

# Move/swap window lef/right (swaps if window exists, otherwise moves to workspace)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
# bindm = $mainMod, mouse:272, movewindow
# bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, ~/.config/hypr/ddc-brightness.sh up
bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/ddc-brightness.sh down

# Keyboard backlight control
bindel = ,XF86KbdBrightnessUp, exec, sh -c 'echo $(($(cat /sys/class/leds/chromeos::kbd_backlight/brightness) + 10)) | tee /sys/class/leds/chromeos::kbd_backlight/brightness'
bindel = ,XF86KbdBrightnessDown, exec, sh -c 'echo $(($(cat /sys/class/leds/chromeos::kbd_backlight/brightness) - 10)) | tee /sys/class/leds/chromeos::kbd_backlight/brightness'

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Lid switch: layout is handled automatically by kanshi (it reacts to
# monitor hotplug). On close, lid-closed.sh suspends only if no external
# monitors are attached.
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/lid-closed.sh
# On open: force the internal panel back on. Opening the lid is NOT a DRM
# hotplug (eDP-1 never disconnects), so kanshi never re-fires; if eDP-1 was
# left DPMS-off (e.g. externals unplugged while closed), nothing else wakes it.
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on eDP-1

# Server-mode submap: entered by the server-mode script when the display is
# off. Any keypress stops the service, which triggers cleanup (DPMS on,
# suspend inhibitor released). Hyprland processes keybinds even with DPMS off.
submap = server-mode-exit
bind = , catchall, exec, systemctl --user stop server-mode.service
submap = reset
