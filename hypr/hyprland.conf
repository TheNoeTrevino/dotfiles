
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

autogenerated = 0 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
#
# Monitor geometry (position/mode/scale/transform) is managed by kanshi:
#   ~/.config/kanshi/config  -> profiles "docked" and "laptop"
# Workspace assignment + caps:swapescape live in the kanshi exec hooks:
#   ~/.config/hypr/on-docked.sh  and  ~/.config/hypr/on-laptop.sh
#
# Docked layout (left to right):
#   ASUS VP229     - portrait  - chats/comms (workspace 1)
#   Dell AW2725QF  - 4K center - main work   (workspaces 2-5)
#   Lenovo S27q-10 - 1440p     - secondary   (workspaces 6-9)

# Fallback for any display not covered by a kanshi profile. kanshi
# (exec-once below) overrides this for known monitors at startup.
monitor = , preferred, auto, 1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
# herdr launches or attaches to its persistent session on its own, so it needs
# no `attach ||` fallback the way tmux did.
$terminal = ghostty -e herdr
$fileManager = dolphin
# fuzzel replaced wofi as launcher AND as the dmenu for every picker here.
# Geometry, colours and match mode all live in ~/.config/fuzzel/fuzzel.ini, so
# this stays a bare command — no flags to keep in sync across call sites.
#
# Why wofi went: measured off a 120fps capture, wofi mapped its window at the
# right size but with an EMPTY body for ~42ms, then inserted entries in three
# visible batches over ~33ms, and repeated that rebuild on every keystroke.
# That is GtkListBox churn in wofi's drun implementation — not a Hyprland
# animation (animations:enabled is 0), not the GTK theme, and not fixable by
# configuration. fuzzel is plain C with no GTK and renders in one shot.
$menu = fuzzel

$notification = swaync-client -t -sw


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
# kanshi watches for monitor hotplug and applies the matching profile,
# replacing the old monitors.sh / hypr-monitors.service setup.
exec-once = awww-daemon
exec-once = kanshi
exec-once = waybar
exec-once = swaync
exec-once = swayosd-server
exec-once = hyprsunset
# Clipboard history (cliphist) — watch both text and images
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# hypridle is now a systemd user service (hypridle.service) bound to
# graphical-session.target — gives it proper SIGTERM ordering on logout.
# Enable once with:  systemctl --user enable --now hypridle.service
exec-once = /usr/lib/polkit-kde-authentication-agent-1            # GUI auth prompts (sudo, mounts, etc.)
exec-once = [workspace 1 silent] ghostty -e herdr
exec-once = [workspace 2 silent] zen-browser
# Assign zen-browser to workspace 2
# assign = ^zen-browser$ 2
# exec-once = zen-browser
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

# DO NOT re-enable the line below with the placeholder text in it. It was run
# once verbatim, which wrote the literal string "YOUR_DARK_GTK3_THEME" into
# dconf. No such theme exists, so GTK3 fell back to *light* Adwaita and every
# GTK app flashed white for a frame before its own CSS loaded. (This was first
# caught via wofi, since it opened constantly; wofi is gone but the fix still
# matters for dolphin, GTK file pickers and every other GTK3 app.)
# exec = gsettings set org.gnome.desktop.interface gtk-theme "YOUR_DARK_GTK3_THEME"   # for GTK3 apps
#
# GTK3 theming is now declared statically in ~/.config/gtk-3.0/settings.ini
# (gtk-application-prefer-dark-theme=1), which is why there is no exec here.
# NOTE: gtk-3.0/ is in .gitignore, so that file is NOT tracked by this repo.
# color-scheme below is still worth setting — it is the GTK4/libadwaita key and
# has no effect on GTK3.
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###
###################

