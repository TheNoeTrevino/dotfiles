# Per-monitor wallpaper assignments.  Sourced by ~/.config/hypr/wallpaper.sh
# and rewritten by the waybar picker (~/.config/waybar/scripts/wallpaper-select.sh).
#
# Monitors are matched by EDID serial substring — the SAME stable key kanshi
# and the on-*.sh hooks use — because DP-x connector numbers renumber on replug.
# Look up a monitor's serial with:  hyprctl monitors all | grep description
#
# Wallpaper values may be a bare filename (resolved under WALLPAPER_DIR) or an
# absolute path.  Edit freely; run ~/.config/hypr/wallpaper.sh to apply.

WALLPAPER_DIR="$HOME/.config/wallpapers"

# Fallback for the laptop screen (eDP-1) and any monitor not listed below.
WP_MAIN="chainsaw-man-the-5120x2880-23852.jpg"

# serial substring -> wallpaper file
declare -A WP_BY_SERIAL=(
  [T3LMQS142415]="samurai-cat.png"                  # ASUS VP229      LEFT, portrait
  [CQF2D34]="chainsaw-man-the-5120x2880-23852.jpg"  # Dell AW2725QF   MAIN / center 4K
  [V5XT8124]="reze-arc.jpg"                            # Lenovo S27q-10  RIGHT
)
