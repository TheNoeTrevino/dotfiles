# fuzzel — launcher + dmenu replacement for wofi.
#
# WHY THE SWITCH: measured from a 120fps screen recording, wofi maps its window
# at full size but with an EMPTY body for ~42ms, then inserts entries in three
# visible batches over the next ~33ms (it parses 133 .desktop files on a worker
# and adds GtkListBoxRow widgets via GTK idle callbacks). That batched fill is
# the "jitter" — it is architectural, not configurable, and it repeats on every
# keystroke because each filter rebuilds the list the same way.
#
# fuzzel is plain C on Wayland with no GTK, so there is no widget tree to churn.

font=JetBrainsMono Nerd Font:size=14

# Mixed-scale setup (Dell @1.5, portrait ASUS @1, laptop @2). `no` makes fuzzel
# follow the compositor's scale factor rather than guessing from DPI, which is
# the predictable choice when the launcher can appear on any of the three.
dpi-aware=no

# The whole reason the launcher was worth changing: wofi's default matching was
# `contains`, so "fox" never found "Firefox". fzf mode does subsequence matching
# (f-o-x matches FirefOX). Alternatives: exact | fuzzy (levenshtein, and it
# ignores search strings shorter than fuzzy-min-length, default 3).
match-mode=fzf

# NOTE: width is in CHARACTERS here, not pixels (unlike wofi's --width).
width=50
lines=20

horizontal-pad=20
vertical-pad=14
inner-pad=10

icons-enabled=yes
icon-theme=Adwaita

# For .desktop entries with Terminal=true.
terminal=ghostty -e

prompt="󰿄 "
layer=overlay

# Fully opaque on purpose. A translucent background would have Hyprland
# recompositing the wallpaper behind it on every repaint, which is the kind of
# thing we are trying to get away from.
[colors]
background=1e1e2eff
text=cdd6f4ff
prompt=a6adc8ff
placeholder=6c7086ff
input=cdd6f4ff
match=cba6f7ff
selection=45475aff
selection-text=cdd6f4ff
selection-match=cba6f7ff
border=cba6f7ff

[border]
width=2
radius=0

[dmenu]
# wallpaper-select.sh feeds thumbnails through the Rofi extended dmenu protocol
# (NAME\0icon\x1f/path). Ratio is relative to line height.
exit-immediately-if-empty=yes
